name: Build Eon (R8 release)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      # assembleRelease runs R8 (minify + shrink resources), as set in app/build.gradle.kts
      - name: Build release APK
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/eon-${{ github.run_number }}.apk"

      # Option 1: a zip you download from the run page (unzip, then install the .apk)
      - uses: actions/upload-artifact@v4
        with:
          name: eon-apk
          path: dist/*.apk

      # Option 2: the plain .apk on the Releases page, no unzipping needed
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Eon build ${{ github.run_number }}
          files: dist/*.apk
          prerelease: true
